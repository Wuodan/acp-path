name: OpenRouter smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, opencode, vibe]
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      WSLENV: OPENROUTER_API_KEY/u
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - shell: pwsh
        run: |
          wsl --install --distribution Ubuntu-26.04 --no-launch
          wsl --distribution Ubuntu-26.04 -- bash -lc 'apt-get update && apt-get install -y curl ca-certificates nodejs npm'
      - if: matrix.agent == 'codex'
        shell: pwsh
        run: wsl --distribution Ubuntu-26.04 -- bash -lc 'npm install -g @openai/codex @agentclientprotocol/codex-acp'
      - if: matrix.agent == 'opencode'
        shell: pwsh
        run: wsl --distribution Ubuntu-26.04 -- bash -lc 'npm install -g opencode-ai'
      - if: matrix.agent == 'vibe'
        shell: pwsh
        run: wsl --distribution Ubuntu-26.04 -- bash -lc 'export PATH="$HOME/.local/bin:$PATH"; curl -fsSL https://mistral.ai/vibe/install.sh | bash'
      - name: Smoke with Windows acp-path
        shell: pwsh
        run: |
          go build -o "$env:GITHUB_WORKSPACE/acp-path.exe" ./cmd/acp-path
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = wsl --distribution Ubuntu-26.04 -- wslpath -u "$workspace"
          $env:ACP_PATH_SMOKE_MARKER_PATH = "$root/acp-path-openrouter-smoke.txt"
          go run ./integration/openrouter -- "$env:GITHUB_WORKSPACE/acp-path.exe" --log-file "$env:GITHUB_WORKSPACE/acp-path-windows.log" -- wsl --distribution Ubuntu-26.04 -- bash "$root/scripts/run-openrouter-agent.sh" "${{ matrix.agent }}"
      - name: Smoke with WSL acp-path
        shell: pwsh
        run: |
          $env:GOOS = 'linux'
          $env:GOARCH = 'amd64'
          go build -o "$env:GITHUB_WORKSPACE/acp-path" ./cmd/acp-path
          Remove-Item Env:GOOS
          Remove-Item Env:GOARCH
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $root = wsl --distribution Ubuntu-26.04 -- wslpath -u "$workspace"
          $env:ACP_PATH_SMOKE_MARKER_PATH = "$root/acp-path-openrouter-smoke.txt"
          go run ./integration/openrouter -- wsl --distribution Ubuntu-26.04 -- "$root/acp-path" --log-file "$root/acp-path-wsl.log" -- bash "$root/scripts/run-openrouter-agent.sh" "${{ matrix.agent }}"
      - name: Upload acp-path logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-path-logs-${{ matrix.agent }}
          path: |
            acp-path-windows.log
            acp-path-wsl.log
          if-no-files-found: warn
