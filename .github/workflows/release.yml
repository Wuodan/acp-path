name: Release
run-name: Release (${{ github.ref_name }})

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tagged-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}" >&2
            echo "is not on origin/${DEFAULT_BRANCH}." >&2
            exit 1
          fi

  change-validation:
    needs: verify-tagged-commit
    uses: ./.github/workflows/change-validation.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write

  release:
    needs:
      - verify-tagged-commit
      - change-validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: go.mod

      - name: Download verified Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winget-release-assets
          path: dist

      - name: Build Linux binaries
        env:
          CGO_ENABLED: "0"
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for binary in acp-wsl acp-wsl-debug; do
            for arch in amd64 arm64; do
              GOOS=linux GOARCH="${arch}" go build -trimpath \
                -o "dist/${binary}-linux-${arch}" \
                -ldflags "-X main.version=${RELEASE_TAG}" \
                "./cmd/${binary}"
            done
          done

      - name: Create SHA256SUMS
        run: |
          set -euo pipefail
          cp .github/versions/acp-schema.yml dist/acp-schema-versions.yml
          cd dist
          LC_ALL=C find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | \
            sort -z | \
            xargs -0 sha256sum \
            > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --generate-notes

  verify-published-winget-manifest:
    needs: release
    uses: ./.github/workflows/winget-published.yml
